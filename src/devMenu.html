<div id="devopts" style="display: none">
    <div>
        <button onclick="dev.openEditLvlOverlay()" style="width: 100%">
            Edit level
        </button>

        <input id="worldInput" class="hogfocus" type="text" placeholder="Current">
        <button onclick="dev.testWorld(document.getElementById('worldInput').value)">
            Test level
        </button>
        <button onclick="dev.testWorld()">Test sample</button>
        <br><br>
        <button onclick="dev.rmBounds()">Remove bounds</button>
        <button onclick="dev.addBoundPoint()">Add bound point</button>
        <br>
        <label>
            <input type="checkbox" onchange="dev.setUseBounds(this.checked)" checked>
            Collide with bounds
        </label>
    </div><div>
        <button onclick="dev.setAllDebugOverlays(true)">All on</button>
        <button onclick="dev.setAllDebugOverlays(false)">All off</button>

        <br>
        <label>
            <input type="checkbox" class="dbcb" onchange="dev.setBoundsPolygonVisible(this.checked)">
            Show bounds polygon
        </label>
        <br>
        <label>
            <input type="checkbox" class="dbcb" onchange="dev.setCollidersVisible(this.checked)">
            Show colliders
        </label>
        <br>
        <label>
            <input type="checkbox" class="dbcb" onchange="dev.setExitZonesVisible(this.checked)">
            Show exit zones
        </label>
        <br>
        <label>
            <input type="checkbox" class="dbcb" onchange="dev.setSpawnPointsVisible(this.checked)">
            Show spawn points
        </label>
        <br>
        <label>
            <input type="checkbox" class="dbcb" onchange="dev.setBuildGridVisible(this.checked)">
            Show build grid
        </label>
    </div>
</div>
