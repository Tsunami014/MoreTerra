<div id="devopts" style="display: none">
    <div>
        <button class="bigbtn" onclick="dev.openEditLvlOverlay()" style="width: 100%">
            Edit level
        </button>

        <input id="worldInput" type="text" placeholder="Current">
        <button onclick="dev.testWorld(document.getElementById('worldInput').value)">
            Test level
        </button>
        <button onclick="dev.testWorld()">Test sample</button>
        <br><br>
        <button onclick="dev.rmBounds()">Remove bounds</button>
        <button onclick="dev.addBoundPoint()">Add bound point</button>
        <br>
        <label>
            <input type="checkbox" onchange="dev.setUseBounds(this.checked)" checked>
            Collide with bounds
        </label>
        <br>
        <label>
            <input type="checkbox" onchange="dev.setUseColliders(this.checked)" checked>
            Collide with colliders
        </label>
    </div><div style="white-space: pre;">
        <button class="bigbtn" onclick="dev.setAllDebugOverlays(true)">All on</button>
        <button class="bigbtn" onclick="dev.setAllDebugOverlays(false)">All off</button>

        <br>
        <label>
            <input type="checkbox" class="dbcb" onchange="dev.setBoundsPolygonVisible(this.checked)">
            Show bounds polygon
        </label>
        <br>
        <label>
            <input type="checkbox" class="dbcb" onchange="dev.setCollidersVisible(this.checked)">
            Show colliders
        </label>
        <br>
        <label>
            <input type="checkbox" class="dbcb" onchange="dev.setExitZonesVisible(this.checked)">
            Show exit zones
        </label>
        <br>
        <label>
            <input type="checkbox" class="dbcb" onchange="dev.setSpawnPointsVisible(this.checked)">
            Show spawn points
        </label>
        <br>
        <label>
            <input type="checkbox" class="dbcb" onchange="dev.setBuildGridVisible(this.checked)">
            Show build grid
        </label>
        <br><br>
        <label>
            <input type="checkbox" id="pointlightcb" onchange="dev.setPointLightsVisible(this.checked)">
            Show point lights
        </label>
    </div><div>
        <span>Debug element</span>
        <button onclick="tmpobj.remove()">Remove</button>
        <br>
        <input id="elmIdInp" type="text" placeholder="Element to copy">
        <button onclick="tmpobj.create(document.getElementById('elmIdInp').value)">
            Copy
        </button>
        <button onclick="tmpobj.create()">Use sample</button>
        <br>
        <button onclick="tmpobj.teleport()">Warp</button>
        <button onclick="tmpobj.permanentise()">Permanent</button>
        <br>
        <button class="bigbtn" onclick="toggleObjOpts()" style="width: 100%">
            Edit temp object
        </button>
        <br><br>
        <label>
            <input type="checkbox" onchange="dev.setUseExits(this.checked)" checked>
            Exit zones active
        </label>
    </div>
</div>
