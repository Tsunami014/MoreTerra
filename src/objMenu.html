<div id="objopts" style="display: none">
    <label>Image path
        <input type="text" class="ooinp lvlattr" data-dat="path">
    </label>
    <label>X
        <input type="number" step="0.2" class="ooinp lvlattr" data-dat="x" data-typ="num">
    </label>
    <label>Z
        <input type="number" step="0.2" class="ooinp lvlattr" data-dat="z" data-typ="num">
    </label>
    <label>Rotation
        <input type="number" step="0.1" class="ooinp lvlattr" data-dat="rotation" data-typ="num">
    </label>
    <label>Scale
        <input type="number" step="0.2" class="ooinp lvlattr" data-dat="scale" data-typ="num">
    </label>
    <label>Flip X
        <input type="checkbox" class="ooinp lvlattr" data-dat="flipX" data-typ="bool">
    </label>
    <label>Width
        <input type="number" step="0.2" class="ooinp manifattr" data-dat="width" data-typ="num">
    </label>
    <label>Height
        <input type="number" step="0.2" class="ooinp manifattr" data-dat="height" data-typ="num">
    </label>
    <label>Z-Offset
        <input type="number" step="0.2" class="ooinp manifattr" data-dat="zOffset" data-typ="num">
    </label>
    <label>Fade at base
        <input type="checkbox" class="ooinp bothattr" data-dat="baseFade" data-typ="bool">
    </label>
    <label>Sway when walk over
        <input type="checkbox" class="ooinp manifattr" data-dat="sway" data-typ="bool">
    </label>
    <label>Render mode
        <select class="ooinp manifattr" data-dat="renderMode">
            <option value="">Regular</option>
            <option value="flat">Flat on ground</option>
        </select>
    </label>
    <span class="manifattr">Anchor: The normalised (0-1) point in the<br>image which is placed on the centre</span>
    <label>Anchor X
        <input type="number" step="0.25" class="ooinp manifattr" data-dat="anchor.x" data-typ="num">
    </label>
    <label>Anchor Y
        <input type="number" step="0.25" class="ooinp manifattr" data-dat="anchor.y" data-typ="num">
    </label>
    <span class="manifattr">Colliders</span>
    <textarea disabled rows="10" style="resize: none;">$$COLLIDEREXAMPLES$$</textarea>
    <button style="width: 100%;">Apply below colliders</button>
    <textarea id="collidersinp" class="manifattr" style="height: 150px;">Collider code here</textarea>
    <br>
    <span>Result</span>
    <div>
        <button onclick="tmpobj.copy(false)" style="width: 50%;">Copy level json</button>
        <button onclick="tmpobj.copy(true)" style="width: 50%;">Copy Manifest js</button>
    </div>
</div>
